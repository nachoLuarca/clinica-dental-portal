<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clínica dental — Reserva de hora en línea</title>
    <meta
      name="description"
      content="Revisa nuestros tratamientos dentales y reserva tu hora en línea de forma rápida."
    />
    <!--
      Linea base de CSP entregable desde el HTML. `frame-ancestors` NO se
      puede fijar via <meta> (el spec la ignora fuera de un header HTTP) —
      la proteccion de clickjacking (`X-Frame-Options`/`frame-ancestors`)
      queda pendiente de configurar como header en la capa de hosting, una
      vez que se elija (Vercel/Netlify/Cloudflare Pages/etc.). `__API_ORIGIN__`
      lo reemplaza el plugin de `vite.config.ts` en build time con el origen
      (sin path) de `VITE_API_BASE_URL` — ver el comentario de ese plugin
      sobre por qué no alcanza con la sintaxis `%VITE_API_BASE_URL%` nativa
      de Vite acá.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' __API_ORIGIN__; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
